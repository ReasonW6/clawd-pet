[package]
name = "clawd-pet"
version = "0.1.0"
description = "A pixel desktop pet that reacts to Claude Code"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
notify = "8"
rfd = "0.15"
# The version tauri already builds, plus TLS through the system (schannel) and the
# system proxy settings, for the AI chat.
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "system-proxy"] }
base64 = "0.23"
jpeg-encoder = "0.6"

[target.'cfg(windows)'.dependencies]
# The same version tauri already builds; only for UI Automation, which is COM.
windows = { version = "0.62", features = [
  "Win32_System_Com",
  "Win32_System_Variant",
  "Win32_UI_Accessibility",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Networking_WinInet",
  "Win32_System_DataExchange",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Power",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_Accessibility",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
