<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Clawd Pet</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="bubble-area">
      <div id="bubble" hidden></div>
    </div>
    <div id="chat"></div>
    <div id="pet">
      <img id="sprite" draggable="false" alt="" />
      <div id="pet-hit"></div>
    </div>
    <div id="status">
      <div id="quota" hidden><i class="five"></i><i class="week"></i></div>
      <div id="label" hidden></div>
      <div id="dot" hidden></div>
    </div>
    <div id="quota-card" hidden></div>
    <script src="anims.js"></script>
    <script src="markdown.js"></script>
    <script src="pet.js"></script>
  </body>
</html>
